# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # --- Tipos y seguridad ---
    always_declare_return_types: true
    # Obliga a castear antes de llamar métodos sobre dynamic.
    avoid_dynamic_calls: true
    unnecessary_this: true
    use_super_parameters: true
    camel_case_types: true

    # --- Variables y campos ---
    prefer_final_locals: true
    prefer_final_fields: true
    avoid_redundant_argument_values: true
    # `() => foo()` > `foo` directamente cuando es equivalente.
    unnecessary_lambdas: true

    # --- Estilo y formato ---
    # Comillas simples salvo que el string contenga una comilla simple.
    prefer_single_quotes: true
    # Orden de imports: dart: > package: > relativas.
    directives_ordering: true
    # Coma trailing en multilínea — produce diffs más limpios en git.
    require_trailing_commas: true
    avoid_empty_else: true
    sort_constructors_first: true

    # --- Widgets: usar el widget más específico ---
    # Container solo para decoración > DecoratedBox.
    use_decorated_box: true
    # Container sin propiedades > eliminarlo.
    avoid_unnecessary_containers: true
    # Container solo para tamaño > SizedBox.
    sized_box_for_whitespace: true
    prefer_const_literals_to_create_immutables: true
    # Flutter reutiliza widgets const entre rebuilds — mejora rendimiento.
    prefer_const_constructors: true

    # --- Design system ---
    # Fuerza Color(0xFFxxxxxx) con alpha explícito. Complementa los tokens
    # de design_tokens.dart pero NO impide Colors.red — para eso usar
    # avoid_hardcoded_colors de very_good_analysis.
    use_full_hex_values_for_flutter_colors: true

    # --- Seguridad en producción ---
    # Usar AppLogger en su lugar.
    avoid_print: true

    # --- Rendimiento ---
    # Concatenaciones en bucles > StringBuffer (evita O(n²) de memoria).
    use_string_buffers: true
    # Future ignorado silenciosamente > bug difícil de rastrear.
    unawaited_futures: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
